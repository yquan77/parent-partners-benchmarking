<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semakan Draf Bahasa Melayu · 46 Slaid</title>
<link rel="stylesheet" href="my.css">
</head>
<body>
  <main class="review-shell">
    <div class="review-kicker">Versi disemak · Bahasa Melayu Malaysia</div>
    <h1 class="review-title">46 sari kata Bahasa Melayu</h1>
    <p class="review-intro">Setiap kad sepadan dengan satu slaid dalam pembentangan utama. Halaman ini untuk semakan bahasa sahaja dan tidak akan dipaparkan kepada audiens.</p>
    <div class="review-list" id="review-list"></div>
  </main>

  <script src="../assets/js/malay-content.js"></script>
  <script>
    const list = document.getElementById("review-list");
    window.MALAY_SLIDES.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "review-item";
      const header = document.createElement("header");
      const label = document.createElement("span");
      const number = document.createElement("span");
      const text = document.createElement("p");
      label.textContent = item.label;
      number.textContent = `Slaid ${String(index + 1).padStart(2, "0")}`;
      text.textContent = item.text;
      header.append(label, number);
      card.append(header, text);
      list.appendChild(card);
    });
  </script>
</body>
</html>
